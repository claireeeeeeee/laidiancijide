<!doctype html>
<html lang="zh-CN" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>来点刺激的</title>
<meta name="description" content="来都来了">
<meta name="theme-color" content="#1E1033">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-title" content="来点刺激的">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不阻塞页面：加载不到（比如国内网络）就用系统字体 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css?v=22">
<link rel="stylesheet" href="install-guide.css?v=1">
<link rel="stylesheet" href="drawing.css?v=1">
<script>
  // 先套上本机皮肤，模拟模式下每个玩家分别保存。
  (() => {
    const params = new URLSearchParams(location.search);
    const player = params.has('mock') && params.get('p');
    let skin;
    try { skin = localStorage.getItem('ldc_skin' + (player ? '_p' + player : '')); } catch (e) {}
    if (!['night', 'oc', 'sakura'].includes(skin)) {
      const hour = new Date().getHours();
      skin = hour >= 19 || hour < 6 ? 'night' : 'oc';
    }
    document.documentElement.dataset.skin = skin;
  })();
</script>
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay"></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script src="config.js?v=10"></script>

</body>
</html>
