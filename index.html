<!doctype html>
<html lang="zh-CN" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>来点刺激的</title>
<meta name="description" content="来都来了">
<meta name="theme-color" content="#1E1033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不阻塞页面：加载不到（比如国内网络）就用系统字体 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css?v=1">
<script>
  // 先套上皮肤，避免闪一下
  (function(){var k=null;try{k=localStorage.getItem('ldc_skin')}catch(e){}
   if(!k){var h=new Date().getHours();k=(h>=19||h<6)?'night':'oc'}
   document.documentElement.dataset.skin=k;})();
</script>
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay"></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="api.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
